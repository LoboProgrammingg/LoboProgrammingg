<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Matheus Lobo — CTO, Software Architect &amp; AI Systems Engineer</title>
  <desc id="heroDesc">Header banner profissional para GitHub de Matheus Lobo com constelação cyber de lobo, terminal de código e telemetria.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="35%" stop-color="#070e1b" />
      <stop offset="75%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#041822" />
    </linearGradient>

    <!-- Name & Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Terminal Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="greenGlow" cx="15%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="90%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#475569" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.18" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Frame Clip -->
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="440" rx="20" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

    .font-sans { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* Keyframe Animations */
    .pulse-online { animation: pulseGreen 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse-node { animation: pulseGlow 3s ease-in-out infinite; }
    .cursor-blink { animation: blink 1.1s steps(2, start) infinite; }
    .scan-beam { animation: scan 8s linear infinite; }
    .float-slow { animation: float 6s ease-in-out infinite; }
    .dash-flow { stroke-dasharray: 6 10; animation: dash 12s linear infinite; }
    .rotate-hud { transform-origin: 930px 210px; animation: rotateHud 35s linear infinite; }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.35); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-440px); opacity: 0; }
      15% { opacity: 0.35; }
      85% { opacity: 0.35; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -160; }
    }
    @keyframes rotateHud {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-online, .pulse-node, .cursor-blink, .scan-beam, .float-slow, .dash-flow, .rotate-hud {
        animation: none !important;
      }
    }
  </style>

  <!-- Main Frame Container -->
  <g clip-path="url(#frameClip)">
    <!-- Background Layers -->
    <rect width="1200" height="440" fill="url(#bgGrad)" />
    <rect width="1200" height="440" fill="url(#greenGlow)" />
    <rect width="1200" height="440" fill="url(#cyanGlow)" />
    <rect width="1200" height="440" fill="url(#indigoGlow)" />
    <rect width="1200" height="440" fill="url(#grid)" />

    <!-- Ambient Light Beam -->
    <g class="scan-beam" opacity="0.15">
      <rect x="0" y="0" width="1200" height="60" fill="url(#accentGrad)" opacity="0.3" transform="skewY(-4)" />
    </g>

    <!-- Top Status Bar -->
    <g transform="translate(50, 48)">
      <circle cx="8" cy="8" r="5" fill="#34D399" filter="url(#glow)" />
      <circle cx="8" cy="8" r="8" fill="none" stroke="#34D399" stroke-width="1.5" class="pulse-online" style="transform-box: fill-box; transform-origin: center;" />
      
      <text x="26" y="12" class="font-mono" font-size="12" font-weight="600" fill="#34D399" letter-spacing="2">SYSTEM STATUS: ONLINE</text>
      <text x="210" y="12" class="font-mono" font-size="12" fill="#475569">|</text>
      <text x="228" y="12" class="font-mono" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">SENIOR SOFTWARE ENGINEER &amp; CTO</text>
    </g>

    <!-- Main Title: Matheus Lobo -->
    <g transform="translate(50, 118)">
      <text class="font-sans" font-size="58" font-weight="900" letter-spacing="-1" fill="url(#textGrad)" filter="url(#glow)">Matheus Lobo</text>
    </g>

    <!-- Subtitle Role Badges -->
    <g transform="translate(50, 154)">
      <!-- Badge 1: CTO & Cofounder -->
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="18" class="font-mono" font-size="12" font-weight="700" fill="#34D399">CTO &amp; CO-FOUNDER</text>

      <!-- Badge 2: Software Architect -->
      <rect x="177" y="0" width="185" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="189" y="18" class="font-mono" font-size="12" font-weight="700" fill="#38BDF8">SOFTWARE ARCHITECT</text>

      <!-- Badge 3: AI & Cloud Systems -->
      <rect x="374" y="0" width="170" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="386" y="18" class="font-mono" font-size="12" font-weight="700" fill="#818CF8">AI &amp; CLOUD SYSTEMS</text>
    </g>

    <!-- Interactive Terminal Code Window -->
    <g transform="translate(50, 204)">
      <!-- Card Container -->
      <rect width="575" height="154" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
      
      <!-- Terminal Header Bar -->
      <path d="M 0 12 Q 0 0 12 0 L 563 0 Q 575 0 575 12 L 575 32 L 0 32 Z" fill="#0B1220" />
      <line x1="0" y1="32" x2="575" y2="32" stroke="#1E293B" stroke-width="1" />
      
      <!-- Window Controls -->
      <circle cx="18" cy="16" r="4.5" fill="#EF4444" opacity="0.8" />
      <circle cx="34" cy="16" r="4.5" fill="#F59E0B" opacity="0.8" />
      <circle cx="50" cy="16" r="4.5" fill="#10B981" opacity="0.8" />
      <text x="70" y="20" class="font-mono" font-size="11" fill="#64748B">architect@matheus-lobo:~ (production)</text>

      <!-- Code Content -->
      <g transform="translate(18, 54)" class="font-mono" font-size="12.5">
        <!-- Command Line -->
        <text x="0" y="0" fill="#64748B">$</text>
        <text x="16" y="0" fill="#38BDF8" font-weight="600">cat</text>
        <text x="48" y="0" fill="#F1F5F9">engineering_philosophy.json</text>
        
        <!-- JSON Line 1 -->
        <text x="0" y="22" fill="#94A3B8">{</text>
        <text x="16" y="22" fill="#34D399">"mission"</text>
        <text x="88" y="22" fill="#94A3B8">:</text>
        <text x="100" y="22" fill="#F8FAFC">"Transforming operational complexity into reliable products"</text>
        <text x="528" y="22" fill="#94A3B8">,</text>

        <!-- JSON Line 2 -->
        <text x="16" y="44" fill="#34D399">"stack"</text>
        <text x="72" y="44" fill="#94A3B8">:[</text>
        <text x="88" y="44" fill="#38BDF8">"Python"</text>
        <text x="152" y="44" fill="#94A3B8">,</text>
        <text x="164" y="44" fill="#38BDF8">"FastAPI"</text>
        <text x="236" y="44" fill="#94A3B8">,</text>
        <text x="248" y="44" fill="#38BDF8">"Next.js"</text>
        <text x="320" y="44" fill="#94A3B8">,</text>
        <text x="332" y="44" fill="#38BDF8">"AI Agents"</text>
        <text x="424" y="44" fill="#94A3B8">,</text>
        <text x="436" y="44" fill="#38BDF8">"GCP"</text>
        <text x="476" y="44" fill="#94A3B8">],</text>

        <!-- JSON Line 3 -->
        <text x="16" y="66" fill="#34D399">"impact"</text>
        <text x="80" y="66" fill="#94A3B8">:</text>
        <text x="92" y="66" fill="#A7F3D0">"High-availability backend &amp; scalable web/mobile platforms"</text>
        
        <!-- Closing Bracket -->
        <text x="0" y="86" fill="#94A3B8">}</text>
        
        <!-- Blinking Terminal Cursor -->
        <rect x="14" y="74" width="8" height="15" fill="#38BDF8" class="cursor-blink" />
      </g>
    </g>

    <!-- Bottom Telemetry & Metadata -->
    <g transform="translate(50, 394)" class="font-mono" font-size="11" fill="#64748B">
      <text x="0" y="0">LOC: <tspan fill="#94A3B8">Cuiabá, Brazil</tspan></text>
      <text x="140" y="0">•</text>
      <text x="156" y="0">COMPANY: <tspan fill="#34D399">WebFrete (CTO)</tspan></text>
      <text x="310" y="0">•</text>
      <text x="326" y="0">METHOD: <tspan fill="#38BDF8">DDD &amp; Clean Arch</tspan></text>
      <text x="475" y="0">•</text>
      <text x="491" y="0">FOCUS: <tspan fill="#818CF8">Production First</tspan></text>
    </g>

    <!-- Central Divider -->
    <line x1="665" y1="40" x2="665" y2="400" stroke="#1E293B" stroke-dasharray="4 8" stroke-width="1.5" />

    <!-- RIGHT SIDE: GEOMETRIC CYBER WOLF & HUD TELEMETRY -->
    <g transform="translate(680, 0)">
      
      <!-- Orbiting HUD Target Rings -->
      <g class="rotate-hud" opacity="0.45">
        <circle cx="250" cy="210" r="160" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="4 12" stroke-width="1.5" />
        <circle cx="250" cy="210" r="185" fill="none" stroke="#34D399" stroke-opacity="0.15" stroke-dasharray="8 20" stroke-width="1" />
        <circle cx="250" cy="210" r="120" fill="none" stroke="#818CF8" stroke-opacity="0.2" stroke-dasharray="2 8" stroke-width="1" />
      </g>

      <!-- Technical Crosshair Reticle -->
      <g stroke="#475569" stroke-opacity="0.3" stroke-width="1">
        <line x1="250" y1="20" x2="250" y2="40" />
        <line x1="250" y1="380" x2="250" y2="400" />
        <line x1="60" y1="210" x2="80" y2="210" />
        <line x1="420" y1="210" x2="440" y2="210" />
      </g>

      <!-- Geometric Wolf Constellation Art Group -->
      <g class="float-slow" transform="translate(80, 25)">
        
        <!-- Background Flowing Laser Lines (Cyber Mesh) -->
        <g fill="none" stroke="url(#accentGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" filter="url(#glow)">
          <!-- Outer Crest & Silhouette -->
          <path class="dash-flow" d="M 170 30 L 70 85 L 90 170 L 45 250 L 170 375 L 295 250 L 250 170 L 270 85 Z" />
          
          <!-- Ears & Brow Geometry -->
          <path d="M 170 30 L 120 110 L 170 140 L 220 110 Z" />
          <path d="M 70 85 L 120 110 L 90 170 L 140 210 L 170 140" />
          <path d="M 270 85 L 220 110 L 250 170 L 200 210 L 170 140" />

          <!-- Snout & Jaw Architecture -->
          <path d="M 170 140 L 170 280 L 140 210 L 170 280 L 200 210" />
          <path class="dash-flow" d="M 90 170 L 130 255 L 170 280 L 210 255 L 250 170" />
          <path d="M 45 250 L 130 255 L 170 375 L 210 255 L 295 250" />
          <path d="M 130 255 L 115 315 M 210 255 L 225 315" />
          <path d="M 170 280 L 170 375" />
        </g>

        <!-- Constellation Node Vertices (Pulsing Circles) -->
        <g fill="#34D399" filter="url(#glow)">
          <!-- Crown & Ears -->
          <circle cx="170" cy="30" r="4.5" class="pulse-node" />
          <circle cx="70" cy="85" r="4" class="pulse-node" style="animation-delay: 0.3s;" />
          <circle cx="270" cy="85" r="4" class="pulse-node" style="animation-delay: 0.6s;" />
          <circle cx="120" cy="110" r="3.5" class="pulse-node" style="animation-delay: 0.9s;" />
          <circle cx="220" cy="110" r="3.5" class="pulse-node" style="animation-delay: 1.2s;" />

          <!-- Mid Head & Cheek Nodes -->
          <circle cx="90" cy="170" r="4" class="pulse-node" style="animation-delay: 0.4s;" />
          <circle cx="250" cy="170" r="4" class="pulse-node" style="animation-delay: 0.8s;" />
          <circle cx="170" cy="140" r="5" fill="#38BDF8" class="pulse-node" style="animation-delay: 0.2s;" />
          <circle cx="45" cy="250" r="4" class="pulse-node" style="animation-delay: 1.1s;" />
          <circle cx="295" cy="250" r="4" class="pulse-node" style="animation-delay: 1.5s;" />

          <!-- Lower Muzzle & Chin -->
          <circle cx="130" cy="255" r="3.5" class="pulse-node" style="animation-delay: 0.7s;" />
          <circle cx="210" cy="255" r="3.5" class="pulse-node" style="animation-delay: 1.3s;" />
          <circle cx="170" cy="280" r="4.5" fill="#38BDF8" class="pulse-node" style="animation-delay: 0.5s;" />
          <circle cx="170" cy="375" r="5" fill="#818CF8" class="pulse-node" style="animation-delay: 1.0s;" />
        </g>

        <!-- Glowing Cyber Eyes -->
        <g fill="#06B6D4" filter="url(#glowStrong)">
          <polygon points="122,192 145,198 128,206" class="pulse-node" />
          <polygon points="218,192 195,198 212,206" class="pulse-node" style="animation-delay: 0.5s;" />
        </g>
        <g fill="#FFFFFF">
          <circle cx="133" cy="199" r="2" />
          <circle cx="207" cy="199" r="2" />
        </g>

      </g> <!-- End Wolf Group -->

      <!-- Tech HUD Floating Overlay Badges -->
      <g transform="translate(20, 70)" class="font-mono" font-size="10" fill="#64748B">
        <rect x="0" y="0" width="105" height="22" rx="4" fill="#030712" fill-opacity="0.85" stroke="#1E293B" />
        <text x="8" y="14" fill="#34D399">SYS_CORE // OPT</text>
      </g>

      <g transform="translate(350, 110)" class="font-mono" font-size="10" fill="#64748B">
        <rect x="0" y="0" width="105" height="22" rx="4" fill="#030712" fill-opacity="0.85" stroke="#1E293B" />
        <text x="8" y="14" fill="#38BDF8">AI_RAG // ACTIVE</text>
      </g>

      <g transform="translate(20, 310)" class="font-mono" font-size="10" fill="#64748B">
        <rect x="0" y="0" width="115" height="22" rx="4" fill="#030712" fill-opacity="0.85" stroke="#1E293B" />
        <text x="8" y="14" fill="#818CF8">LAT: -15.6014° S</text>
      </g>

      <g transform="translate(340, 330)" class="font-mono" font-size="10" fill="#64748B">
        <rect x="0" y="0" width="115" height="22" rx="4" fill="#030712" fill-opacity="0.85" stroke="#1E293B" />
        <text x="8" y="14" fill="#34D399">SIGNAL OVER NOISE</text>
      </g>

    </g> <!-- End Right Side -->

  </g> <!-- End Frame -->

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="438" rx="20" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.5" stroke-width="1.5" />
</svg>
