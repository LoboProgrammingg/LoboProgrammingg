<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Matheus Lobo Câmara — Founder &amp; Lead Software Architect at Korventi Technologies</title>
  <desc id="description">Banner corporativo e executivo da Korventi Technologies e Matheus Lobo Câmara, apresentando arquitetura de software, sistemas distribuídos e inteligência artificial.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#12131A" />
    </linearGradient>

    <!-- Korventi Copper Accent Gradient -->
    <linearGradient id="copperAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A24" />
      <stop offset="50%" stop-color="#FF7A45" />
      <stop offset="100%" stop-color="#E04010" />
    </linearGradient>

    <!-- Metallic Slate Secondary Gradient -->
    <linearGradient id="slateGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2D3A" />
      <stop offset="100%" stop-color="#161822" />
    </linearGradient>

    <!-- Radial Copper Glow -->
    <radialGradient id="copperGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF5A24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF5A24" stop-opacity="0" />
    </radialGradient>

    <!-- Subtitle Blue-Slate Radial Glow -->
    <radialGradient id="slateGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#FF5A24" fill-opacity="0.2" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="copperFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Border Radius Clip -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1200" height="420" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "Fira Code", monospace; }
    
    .pulse-node { transform-box: fill-box; transform-origin: center; animation: pulseNode 3s ease-in-out infinite; }
    .pulse-slow { transform-box: fill-box; transform-origin: center; animation: pulseNode 4.5s ease-in-out infinite; }
    .scan-line { animation: scanLine 8s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 6 12; animation: dataFlow 12s linear infinite; }
    .cursor-blink { animation: cursorBlink 1.2s steps(1, end) infinite; }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes scanLine {
      0%, 100% { transform: translateY(-50px); opacity: 0; }
      15%, 85% { opacity: 0.15; }
      50% { transform: translateY(450px); opacity: 0.05; }
    }
    @keyframes dataFlow {
      to { stroke-dashoffset: -180; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-node, .pulse-slow, .scan-line, .data-flow, .cursor-blink { animation: none !important; }
    }
  </style>

  <g clip-path="url(#roundedClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1200" height="420" fill="url(#bgGradient)" />
    <rect x="0" y="0" width="1200" height="420" fill="url(#archGrid)" />
    
    <!-- Ambient Glows -->
    <circle cx="150" cy="350" r="300" fill="url(#copperGlow)" />
    <circle cx="1020" cy="80" r="280" fill="url(#slateGlow)" />

    <!-- Scanner overlay -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#copperAccent)" class="scan-line" />

    <!-- Header Tag -->
    <g transform="translate(50, 48)">
      <rect x="0" y="0" width="450" height="26" rx="4" fill="#161822" stroke="#2D3142" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#FF5A24" class="pulse-node" />
      <text x="28" y="17" class="font-mono" font-size="11" font-weight="600" fill="#A0A5B5" letter-spacing="1.5">KORVENTI TECHNOLOGIES // SOFTWARE &amp; AI ARCHITECTURE</text>
    </g>

    <!-- Main Title & Name -->
    <g transform="translate(50, 140)">
      <text x="0" y="0" class="font-sans" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">MATHEUS LOBO CÂMARA</text>
      <text x="0" y="44" class="font-sans" font-size="22" font-weight="700" fill="url(#copperAccent)" letter-spacing="2">FOUNDER &amp; LEAD SOFTWARE ARCHITECT</text>
    </g>

    <!-- Subtitle / Role Badges -->
    <g transform="translate(50, 226)">
      <text x="0" y="0" class="font-mono" font-size="13" font-weight="600" fill="#8E95A5" letter-spacing="1">KORVENTI TECHNOLOGIES</text>
      <text x="200" y="0" class="font-mono" font-size="13" fill="#FF5A24">•</text>
      <text x="218" y="0" class="font-mono" font-size="13" font-weight="600" fill="#8E95A5" letter-spacing="1">WEBFRETE CTO</text>
      <text x="348" y="0" class="font-mono" font-size="13" fill="#FF5A24">•</text>
      <text x="366" y="0" class="font-mono" font-size="13" font-weight="600" fill="#8E95A5" letter-spacing="1">ENTERPRISE SYSTEMS &amp; AI</text>
    </g>

    <!-- Terminal Status Box -->
    <g transform="translate(50, 268)">
      <rect x="0" y="0" width="580" height="52" rx="8" fill="#0C0D12" stroke="#252836" stroke-width="1" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="url(#copperAccent)" />
      <text x="24" y="31" class="font-mono" font-size="14" fill="#E2E8F0">Architecting scalable systems, distributed backends &amp; applied AI</text>
      <rect x="548" y="17" width="2" height="18" fill="#FF5A24" class="cursor-blink" />
    </g>

    <!-- Location Footer -->
    <g transform="translate(50, 362)">
      <text x="0" y="0" class="font-mono" font-size="11" fill="#646A7C" letter-spacing="2">CUIABÁ, BRAZIL  |  SOFTWARE HOUSE  |  SYSTEM ARCHITECTURE</text>
    </g>

    <!-- Vertical Separator Divider -->
    <line x1="680" y1="50" x2="680" y2="370" stroke="#252836" stroke-dasharray="4 8" stroke-width="1" />

    <!-- Right Side: Architectural Node Mesh (Enterprise Blueprint Graphic) -->
    <g transform="translate(720, 35)">
      <!-- Panel Frame Background -->
      <rect x="0" y="0" width="430" height="350" rx="12" fill="#0C0D14" fill-opacity="0.6" stroke="#1E2230" stroke-width="1" />

      <!-- Top Panel Header -->
      <path d="M 0 0 L 430 0 L 430 36 L 0 36 Z" fill="#131520" />
      <circle cx="20" cy="18" r="4" fill="#FF5A24" />
      <circle cx="34" cy="18" r="4" fill="#4B5563" />
      <circle cx="48" cy="18" r="4" fill="#374151" />
      <text x="70" y="22" class="font-mono" font-size="11" fill="#9CA3AF" letter-spacing="1">SYSTEM ARCHITECTURE MESH</text>

      <!-- System Mesh Conduits / Lines -->
      <g fill="none" stroke-width="1.5">
        <!-- Background static grid connecting lines -->
        <path d="M 80 120 L 215 90 L 350 120 L 350 240 L 215 280 L 80 240 Z" stroke="#2A2E3D" />
        <path d="M 215 90 L 215 280" stroke="#2A2E3D" />
        <path d="M 80 120 L 350 240" stroke="#2A2E3D" />
        <path d="M 350 120 L 80 240" stroke="#2A2E3D" />
        <path d="M 80 120 L 215 185 L 350 120" stroke="#2A2E3D" />
        <path d="M 80 240 L 215 185 L 350 240" stroke="#2A2E3D" />

        <!-- Animated Data Flow Lines -->
        <path d="M 80 120 L 215 90 L 350 120 M 350 240 L 215 280 L 80 240" stroke="url(#copperAccent)" stroke-width="2" class="data-flow" filter="url(#copperFilter)" />
        <path d="M 215 90 L 215 185 L 215 280" stroke="#FF5A24" stroke-opacity="0.8" class="data-flow" />
      </g>

      <!-- Nodes (Server & Microservice Points) -->
      <!-- Central Core Node -->
      <g transform="translate(215, 185)">
        <circle cx="0" cy="0" r="28" fill="#161824" stroke="#FF5A24" stroke-width="2" />
        <circle cx="0" cy="0" r="18" fill="url(#copperAccent)" opacity="0.2" />
        <circle cx="0" cy="0" r="6" fill="#FF5A24" class="pulse-node" filter="url(#copperFilter)" />
        <text x="0" y="42" class="font-mono" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">CORE ARCHITECTURE</text>
      </g>

      <!-- Node 1: AI Engines -->
      <g transform="translate(80, 120)">
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#121420" stroke="#3B82F6" stroke-width="1.5" />
        <circle cx="0" cy="0" r="5" fill="#60A5FA" class="pulse-slow" />
        <text x="0" y="-24" class="font-mono" font-size="9" fill="#93C5FD" text-anchor="middle">AI AGENTS</text>
      </g>

      <!-- Node 2: Distributed APIs -->
      <g transform="translate(350, 120)">
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#121420" stroke="#FF5A24" stroke-width="1.5" />
        <circle cx="0" cy="0" r="5" fill="#FF5A24" class="pulse-node" />
        <text x="0" y="-24" class="font-mono" font-size="9" fill="#FF8A50" text-anchor="middle">SCALABLE APIs</text>
      </g>

      <!-- Node 3: Cloud Infra -->
      <g transform="translate(80, 240)">
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#121420" stroke="#10B981" stroke-width="1.5" />
        <circle cx="0" cy="0" r="5" fill="#34D399" class="pulse-slow" />
        <text x="0" y="32" class="font-mono" font-size="9" fill="#6EE7B7" text-anchor="middle">CLOUD INFRA</text>
      </g>

      <!-- Node 4: Data Layer -->
      <g transform="translate(350, 240)">
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#121420" stroke="#8B5CF6" stroke-width="1.5" />
        <circle cx="0" cy="0" r="5" fill="#A78BFA" class="pulse-node" />
        <text x="0" y="32" class="font-mono" font-size="9" fill="#C4B5FD" text-anchor="middle">DATA MESH</text>
      </g>

      <!-- Top & Bottom Telemetry Badges -->
      <g transform="translate(215, 90)">
        <circle cx="0" cy="0" r="4" fill="#FF5A24" />
      </g>
      <g transform="translate(215, 280)">
        <circle cx="0" cy="0" r="4" fill="#FF5A24" />
      </g>

      <!-- Panel Footer Status -->
      <path d="M 0 316 L 430 316 L 430 350 L 0 350 Z" fill="#0E1018" />
      <text x="15" y="337" class="font-mono" font-size="9" fill="#646A7C" letter-spacing="1">STATUS: OPERATIONAL</text>
      <text x="320" y="337" class="font-mono" font-size="9" fill="#FF5A24" letter-spacing="1">KORVENTI v2.0</text>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="#252836" stroke-width="2" />
    <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="url(#copperAccent)" stroke-opacity="0.3" stroke-width="1" />
  </g>
</svg>
